name: Validate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          tracked_artifacts="$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[co]$|.*\.tmp(\.|$))' || true)"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Tracked runtime artifacts found:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Compile Python sources
        run: python3 -m compileall -q app.py esd_backend.py _brand.py pages

  container:
    name: Build deployable container without pushing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag city-of-sealy-pr:${{ github.sha }} .
